<VirtualHost *:80>
    ServerAdmin administrator@lms.org.pl
    ServerName lms.org.pl
    DocumentRoot /var/www/html/lms

    ErrorLog logs/lms.org.pl-error_log
    CustomLog logs/lms.org.pl-access_log common

    <Directory /var/www/html/lms>
        AllowOverride None
        Options -Indexes
        Require all granted
    </Directory>

    <Directory /var/www/html/lms/backups>
        Require all denied
    </Directory>

    <Directory /var/www/html/lms/documents>
        Require all denied
    </Directory>

    <Directory /var/www/html/lms/lib>
        Require all denied
    </Directory>

    <Directory /var/www/html/lms/templates_c>
        Require all denied
    </Directory>

    <Directory /var/www/html/lms/modules>
        Require all denied
    </Directory>

    <Directory /var/www/html/lms/contrib/bin>
        Require all denied
    </Directory>

    <Directory /var/www/html/lms/bin>
        Require all denied
    </Directory>

    <Directory /var/www/html/lms/userpanel/lib>
        Require all denied
    </Directory>

    <Directory /var/www/html/lms/userpanel/templates_c>
        Require all denied
    </Directory>

    <Directory /var/www/html/lms/.git>
        Require all denied
    </Directory>

    <Files "lms.ini">
        Require all denied
    </Files>
</VirtualHost>
